name: Publish update feed

on:
  push:
    branches: [main]
    paths:
      - 'updates/**'
      - '.github/workflows/updates.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate feed
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('updates/appcast.xml')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: updates
      - uses: actions/deploy-pages@v4
        id: deployment
